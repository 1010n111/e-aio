name: CI

# P0 质量门（P0 册 3.8）：PR 与本分支推送到 main 触发。
# 阶段映射——规范里的 8 个阶段在本文件里的落点（写在作业名里，便于对照）：
#   1 编译 ┐
#   2 Lint ├─ backend 作业：compile → test（含架构测试）
#   3 单测 ┘
#   4 架构测试：与单测同一作业（同一份 surefire 报告里跑，避免两次 JVM 启动）
#   5 集成测试：it 作业（Testcontainers 直接用 runner 自带 Docker，不配置 service container）
#   6 安全扫描：license 作业（许可证白名单；CVE 扫描属 P1）
#   1b/2b 前端：frontend 作业（lint + build）
#   7 镜像构建 / 8 发布：属 P1，本批次不交付（P0 册 3.8 阶段 7–8）

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '24'
  MAVEN_ARGS: '-B -ntp'

jobs:
  backend:
    name: '阶段 1-4 后端：编译 · Lint · 单测 · 架构测试'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      # 后端 Lint（checkstyle）按 P0 册 3.8 阶段 2 规范应在流水线里；规则集与门禁级别在 P1 冻结，
      # P0 未启用（见 build-and-test.md 的说明）。前端 Lint 已启用，见 frontend 作业。
      - name: 编译（阶段 1）
        working-directory: backend/e-aio
        run: mvn $MAVEN_ARGS compile
      - name: 单测 + 架构测试（阶段 3-4）
        working-directory: backend/e-aio
        run: mvn $MAVEN_ARGS test

  integration:
    name: '阶段 5 集成测试（Testcontainers，真实执行不跳过）'
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - name: 安装 JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: 确认 Docker 可用（Testcontainers 依赖 runner 自带 Docker）
        run: docker version
      - name: 集成测试：迁移 + 幂等 + 健康检查（阶段 5）
        working-directory: backend/e-aio
        run: mvn $MAVEN_ARGS verify
      - name: 上传集成测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failsafe-reports
          path: backend/e-aio/**/target/failsafe-reports/
          if-no-files-found: ignore

  license:
    name: '阶段 6 许可证扫描（CVE 扫描属 P1）'
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - name: 安装 JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: 许可证白名单校验（阶段 6）
        working-directory: backend/e-aio
        run: mvn $MAVEN_ARGS -DskipTests -DskipITs verify
      - name: 上传依赖许可证清单
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: third-party-licenses
          path: backend/e-aio/**/target/generated-sources/license/THIRD-PARTY.txt
          if-no-files-found: ignore

  frontend:
    name: '阶段 1b-2b 前端：构建 · Lint'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: Lint（阶段 2b）
        run: npm run lint
      - name: 单元测试（请求层）
        run: npm test
      - name: 生产构建（阶段 1b）
        run: npm run build
