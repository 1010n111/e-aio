# local profile：唯一声明连接信息的地方（`--spring.profiles.active=local`）。
# 依赖：docker compose（PostgreSQL + Redis，P0 册 3.8 本地编排）。
spring:
  # 基础配置排除了数据源自动配置（无库可启动），这里把它放回来
  autoconfigure:
    exclude: ""
  datasource:
    # 时区口径：TIMESTAMPTZ 以 UTC 存储，会话时区在基础配置里统一固定（见 application.yml 的
    # spring.datasource.hikari.connection-init-sql）。**不要**在 URL 上挂 options/TimeZone：
    # 实测（pgjdbc 42.7.5）两者都被静默忽略，"看起来配了时区"而实际没配（P1 册 7.5 L10）。
    url: jdbc:postgresql://localhost:5432/eaio
    username: eaio
    password: eaio
  data:
    redis:
      host: localhost
      port: 6379
