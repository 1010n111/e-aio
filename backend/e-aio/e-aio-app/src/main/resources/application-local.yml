# local profile：唯一声明连接信息的地方（`--spring.profiles.active=local`）。
# 依赖：docker compose（PostgreSQL + Redis，P0 册 3.8 本地编排）。
spring:
  # 基础配置排除了数据源自动配置（无库可启动），这里把它放回来
  autoconfigure:
    exclude: ""
  datasource:
    # 时区口径：TIMESTAMPTZ 以 UTC 存储，连接串显式固定会话时区（P1 册 7.5 L10）。
    # 注意 pgjdbc 没有 TimeZone 参数（那是 MySQL Connector/J）：写 TimeZone=UTC 会被当作未知属性
    # 静默忽略，"看起来配了时区"而实际没配；pgjdbc 的正确写法是 options=-c timezone=UTC（URL 编码）。
    url: jdbc:postgresql://localhost:5432/eaio?options=-c%20timezone%3DUTC
    username: eaio
    password: eaio
  data:
    redis:
      host: localhost
      port: 6379
