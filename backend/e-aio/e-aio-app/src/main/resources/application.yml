spring:
  application:
    name: e-aio
  profiles:
    # 默认不激活任何 profile：不连数据库、不连 Redis，应用可直接启动（P0 验收：无依赖启动）
    default: ""

# 数据源与 Redis 只在 local profile 声明：
# 基础配置里不出现连接信息，避免"空应用可启动"与"必须有一个数据库"互相矛盾（P0 册 3.5.2）。
---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5432/eaio
    username: eaio
    password: eaio
  data:
    redis:
      host: localhost
      port: 6379

# 每模块独立 Flyway 实例（P0 册 3.6）：
#   modules 的取值与模块根包同名 —— 脚本目录 classpath:db/migration/<module>，
#   默认 Schema eaio_<module>，历史表建在该 Schema 内，版本号在模块内独立递增。
# 模块登记表的单一来源是 P0 册附录 6.1；新增模块要同时改这里。
eaio:
  flyway:
    enabled: true
    modules:
      - platform
