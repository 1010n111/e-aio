# it profile：集成测试用（Testcontainers 起 PostgreSQL 17 + Redis 7）
#
# 与 test profile 的区别：**把数据源自动配置放回来**（基础配置排除它是为了无库也能启动，
# 见主配置 application.yml 的说明），并**显式开启迁移**——集成测试要验证的行为全部写明，
# 不做"继承默认值"的假设。连接信息由 Testcontainers 运行时注入（动态属性），
# 这里不写死任何地址与凭据。
spring:
  autoconfigure:
    exclude:
  flyway:
    # 显式开启：集成测试要真跑迁移，不依赖"默认是 true"
    enabled: true
server:
  servlet:
    context-path: ""
